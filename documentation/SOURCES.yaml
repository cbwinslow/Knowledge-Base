# Download Settings
settings:
  concurrent_downloads: 5
  timeout: 30
  retry_attempts: 3
  retry_delay: 5
  user_agent: "KnowledgeBase-Bot/1.0"
  respect_robots_txt: true
  rate_limit_delay: 1.0
  max_file_size_mb: 10
  allowed_extensions: [".md", ".rst", ".html", ".txt", ".pdf"]
