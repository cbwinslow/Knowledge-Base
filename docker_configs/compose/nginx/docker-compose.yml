version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Configuration
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      # SSL certificates
      - ./ssl:/etc/nginx/ssl:ro
      # Static content
      - ./html:/usr/share/nginx/html:ro
      # Logs
      - nginx_logs:/var/log/nginx
    networks:
      - proxy_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Example backend service
  backend:
    image: nginx:alpine
    container_name: backend_app
    restart: unless-stopped
    volumes:
      - ./backend:/usr/share/nginx/html:ro
    networks:
      - proxy_network
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  nginx_logs:
    driver: local

networks:
  proxy_network:
    driver: bridge
