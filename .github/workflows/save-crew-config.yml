name: Save CrewAI Configuration

on:
  workflow_dispatch:
    inputs:
      crew_name:
        description: 'Crew name'
        required: true
        type: string
      file_name:
        description: 'File name (e.g., crew_config.yaml, agents.yaml, tasks.yaml, README.md)'
        required: true
        type: string
      content:
        description: 'File content'
        required: true
        type: string

jobs:
  save-crew-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create crew configuration file
        run: |
          CREW_NAME="${{ github.event.inputs.crew_name }}"
          FILE_NAME="${{ github.event.inputs.file_name }}"
          
          DIRPATH="ai_agents/crews/${CREW_NAME}"
          mkdir -p "$DIRPATH"
          FILEPATH="${DIRPATH}/${FILE_NAME}"
          
          # Create backup if file exists
          if [ -f "$FILEPATH" ]; then
            cp "$FILEPATH" "${FILEPATH}.backup-$(date +%Y%m%d_%H%M%S)"
          fi
          
          # Write content to file
          echo '${{ github.event.inputs.content }}' > "$FILEPATH"
          
          echo "Created/updated crew config file: $FILEPATH"

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ai_agents/crews/
          git commit -m "Add/update crew config: ${{ github.event.inputs.crew_name }} - ${{ github.event.inputs.file_name }}"
          git push
